plugins {
    id 'com.android.application'
}

android {
    namespace 'com.frigate.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.frigate.tv"
        minSdk 21          // Fire TV OS 5+ (Android 5.1)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug  // usa debug key para sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    // Sem dependências externas — só WebView nativo do Android
}
